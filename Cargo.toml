[workspace]
resolver = "3"
members = ["crates/shared", "crates/server", "crates/client"]
exclude = ["tools/export-map"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
glam = { version = "0.34.3", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = "0.4.35"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
wgpu = "30.0.2"
postcard = { version = "1", features = ["use-std"] }
ctrlc = "3"
rayon = "1"
memmap2 = "0.9"
winit = "0.30.13"
shared = { path = "crates/shared" }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
