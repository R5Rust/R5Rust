// Example console config: run it with `exec example` in the console (`).
// Copy the lines you like into cfg\autoexec.cfg (gitignored); that one runs by itself once the map has loaded.
// One command per line, or several joined with ; . Lines starting with // are comments.

cl_showfps 1                     // fps in the top right (2 adds a frame time graph)
fly_speed 1500

// console binds: key names as Esc > Controls shows them (F5, MOUSE4, G, ...)
bind F5 "noclip"
bind F6 "getpos"
bind F7 "toggle host_timescale 1 0.25"   // slow motion for movement tech

// aliases chain commands under a new name (getpos prints a line like this, paste it in)
alias spot "setpos -10758 342 1721; setang 10 90"
